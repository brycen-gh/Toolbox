  - label: Settings
    icon: settings
    children:
      - label: Variable Settings
        icon: variables
        content: Change target, host, Docker, SecOnion, and log settings stored in variables/troubleshooting-variables.yaml.
        special: variables_editor

      - label: Config Remote Creds
        icon: save
        content: |
          Prompt for an SSH username, SSH/sudo password, and vault passphrase.
          Only encrypted credential values are written to variables/troubleshooting-variables.yaml.
        action_id: configure_remote_credentials

      - label: Lock Session Creds
        icon: reset
        content: Remove local sudo and decrypted remote creds from memory while preserving encrypted YAML values.
        action_id: lock_remote_credentials

      - label: About
        icon: information
        content: |
          Troubleshooting actions can target this computer or a remote Linux
          host. Editable values are kept in variables/troubleshooting-variables.yaml.
          Remote creds are encrypted and the vault passphrase is never
          written to disk.
