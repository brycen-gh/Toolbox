# Menu layout: labels and children form the sidebar; action_id selects a registered handler.
# Parameters may reference values from VariablesFile using ${VARIABLE_NAME}.
title: Troubleshooting

# ========================================================================
# MENU OVERVIEW
# ========================================================================
Home:
  label: Troubleshooting
  icon: readiness
  content: |
    # Docker and SecOnion Troubleshooting

    Run diagnostics against this computer or a remote Linux host.

    Set TARGET_MODE to local or remote in Variable Settings. Remote usernames
    and passwords are stored only as encrypted values. The vault passphrase is
    never saved and is requested once per application session.

    Most actions are read-only. Bulk container stop/removal and SecOnion
    Check-in change the target system and require confirmation.

VariablesFile: troubleshooting-variables.yaml

menu:
  # ======================================================================
  # DOCKER CLEANUP
  # ======================================================================
  - label: Docker Cleanup
    icon: docker
    content: Inspect Docker and manage containers on the selected host. Bulk stop and removal actions require confirmation.
    children:
      - label: Stop All Containers
        icon: reset
        content: Stop every running Docker container on the selected host, including containers outside Toolbox. Containers and their data remain available to restart.
        action_id: troubleshoot_docker
        confirm: true
        confirm_message: Stop ALL running Docker containers on the selected host, including services outside Toolbox?
        confirm_phrase: STOP ALL CONTAINERS
        parameters:
          mode: containers_stop_all
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          use_sudo: "${DOCKER_USE_SUDO}"

      - label: Remove All Containers
        icon: delete
        content: Force-remove every Docker container on the selected host, including running containers and services outside Toolbox. Container writable-layer data is deleted. Images, volumes, and bind-mounted host files are retained.
        action_id: troubleshoot_docker
        confirm: true
        confirm_message: Permanently remove ALL Docker containers on the selected host and discard their writable-layer data?
        confirm_phrase: REMOVE ALL CONTAINERS
        parameters:
          mode: containers_remove_all
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          use_sudo: "${DOCKER_USE_SUDO}"

      - label: Engine Health
        icon: monitoring
        content: Show Docker versions, daemon information, storage drivers, and disk usage.
        action_id: troubleshoot_docker
        parameters:
          mode: engine
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          use_sudo: "${DOCKER_USE_SUDO}"
          log_lines: "${LOG_LINES}"

      - label: Image Diagnostics
        icon: containers
        content: List image digests and dangling images. If DOCKER_IMAGE is set, also inspect that image and show its history.
        action_id: troubleshoot_docker
        parameters:
          mode: images
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          use_sudo: "${DOCKER_USE_SUDO}"
          image: "${DOCKER_IMAGE}"
          log_lines: "${LOG_LINES}"

      - label: Container Status
        icon: monitoring
        content: List all containers with complete status details and show recent Docker events.
        action_id: troubleshoot_docker
        parameters:
          mode: containers
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          use_sudo: "${DOCKER_USE_SUDO}"
          log_lines: "${LOG_LINES}"



  # ======================================================================
  # CONTAINER ACTIONS
  # ======================================================================
  - label: Container Actions
    icon: containers
    content: Expand a configured Docker container to edit settings, read logs, restart, or remove it.
    children:
      # ==================================================================
      # HOME
      # ==================================================================
      - label: Home
        icon: home
        children:
          - label: Edit Container Settings
            icon: settings
            special: container_settings
            service: HOME
          - label: Read Logs
            icon: logs
            action_id: troubleshoot_docker
            content: Inspect Home and read its web server logs.
            parameters: &home_actions
              mode: container_logs
              target: "${TARGET_MODE}"
              host: "${REMOTE_HOST}"
              port: "${REMOTE_PORT}"
              accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
              use_sudo: "${DOCKER_USE_SUDO}"
              container: "${HOME_CONTAINER_NAME}"
              log_lines: "${LOG_LINES}"
          - label: Restart Container
            icon: reset
            action_id: troubleshoot_docker
            content: Restart Home. To regenerate links, use Install Home with recreation enabled.
            confirm: true
            parameters:
              <<: *home_actions
              mode: container_restart
          - label: Remove Container
            icon: delete
            action_id: troubleshoot_docker
            content: Remove the Home container. Generated site snapshots and the image remain.
            confirm: true
            confirm_phrase: REMOVE CONTAINER
            parameters:
              <<: *home_actions
              mode: container_remove
