  # ======================================================================
  # SECONION
  # ======================================================================
  - label: SecOnion
    icon: security
    content: Run common SecOnion status, resource, service, and log checks.
    children:
      - label: Variable Settings
        icon: variables
        content: Edit SecOnion service and log settings. Target and SSH settings are shared with Docker diagnostics in this menu.
        special: variables_editor
        variable_keys:
          - TARGET_MODE
          - REMOTE_HOST
          - REMOTE_PORT
          - REMOTE_ACCEPT_NEW_HOST_KEY
          - SECURITY_ONION_SERVICE
          - LOG_LINES

      - label: Run so-status
        icon: readiness
        content: Run so-status and list SecOnion containers.
        action_id: troubleshoot_security_onion
        parameters:
          mode: status
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          log_lines: "${LOG_LINES}"

      - label: System Health
        icon: monitoring
        content: Check load, memory, filesystem usage, Docker service health, and failed systemd services.
        action_id: troubleshoot_security_onion
        parameters:
          mode: health
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          log_lines: "${LOG_LINES}"

      - label: Read Core Logs
        icon: logs
        content: Read recent Docker and Salt journals plus SecOnion Suricata and Kibana logs.
        action_id: troubleshoot_security_onion
        parameters:
          mode: logs
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          log_lines: "${LOG_LINES}"

      - label: Selected Service Logs
        icon: logs
        content: Inspect SECURITY_ONION_SERVICE and read its latest Docker logs.
        action_id: troubleshoot_security_onion
        parameters:
          mode: service_logs
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          service: "${SECURITY_ONION_SERVICE}"
          log_lines: "${LOG_LINES}"

      - label: Run SecOnion Check-in
        icon: run
        content: Run so-checkin to apply all Salt states. This can change services and configuration on the target.
        action_id: troubleshoot_security_onion
        confirm: true
        confirm_message: Run a full SecOnion Salt check-in on the selected target?
        parameters:
          mode: checkin
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          log_lines: "${LOG_LINES}"

  # ======================================================================
  # SETTINGS
  # ======================================================================
  - label: Settings
    icon: settings
    children:
