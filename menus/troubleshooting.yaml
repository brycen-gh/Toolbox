              mode: container_remove
              target: "${TARGET_MODE}"
              host: "${REMOTE_HOST}"
              port: "${REMOTE_PORT}"
              accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
              use_sudo: "${DOCKER_USE_SUDO}"
              container: "${ZULIP_CONTAINER_NAME}"

          - label: Edit Container Settings
            icon: settings
            special: container_settings
            service: ZULIP

          - label: Read Logs
            icon: logs
            content: Inspect the Zulip web container and read its recent logs. Use the dependency entries below for database, cache, and queue diagnostics.
            action_id: troubleshoot_docker
            parameters: &zulip_logs
              mode: container_logs
              target: "${TARGET_MODE}"
              host: "${REMOTE_HOST}"
              port: "${REMOTE_PORT}"
              accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
              use_sudo: "${DOCKER_USE_SUDO}"
              container: "${ZULIP_CONTAINER_NAME}"
              log_lines: "${LOG_LINES}"

          - label: Restart Container
            icon: reset
            content: Restart the Zulip web container. Dependency containers continue running.
            action_id: troubleshoot_docker
            confirm: true
            confirm_message: Restart the Zulip web container?
            parameters:
              <<: *zulip_logs
              mode: container_restart

          - label: PostgreSQL Logs
            icon: database
            action_id: troubleshoot_docker
            parameters:
              <<: *zulip_logs
              container: "${ZULIP_CONTAINER_NAME}-database"

          - label: Memcached Logs
            icon: logs
            action_id: troubleshoot_docker
            parameters:
              <<: *zulip_logs
