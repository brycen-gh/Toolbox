            icon: delete
            content: Force-remove the Zulip container, even if running. Writable-layer data is deleted; images, volumes, and bind-mounted files remain. Only the Zulip web container is removed; its dependencies remain.
            action_id: troubleshoot_docker
            confirm: true
            confirm_message: Remove the configured Zulip container and discard its writable-layer data? Only the Zulip web container is removed; its dependencies remain.
            confirm_phrase: REMOVE CONTAINER
