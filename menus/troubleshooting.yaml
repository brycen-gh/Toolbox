title: Troubleshooting

Home:
  label: Troubleshooting
  icon: readiness
  content: |
    # Docker and SecOnion Troubleshooting

    Run diagnostics against this computer or a remote Linux host.

    Set TARGET_MODE to local or remote in Variable Settings. Remote usernames
    and passwords are stored only as encrypted values. The vault passphrase is
    never saved and is requested once per application session.

    Most actions are read-only. Run SecOnion Check-in is clearly marked
    because it applies Salt states and can change the target system.

VariablesFile: troubleshooting-variables.yaml

menu:
  - label: Docker
    icon: docker
    content: Inspect Docker Engine, images, containers, and logs without deleting or pruning data.
    children:
      - label: Engine Health
        icon: readiness
        content: Show Docker versions, daemon information, storage drivers, and disk usage.
        action_id: troubleshoot_docker
        parameters:
          mode: engine
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          use_sudo: "${DOCKER_USE_SUDO}"
          log_lines: "${LOG_LINES}"

      - label: Image Diagnostics
        icon: containers
        content: List image digests and dangling images. If DOCKER_IMAGE is set, also inspect that image and show its history.
        action_id: troubleshoot_docker
        parameters:
          mode: images
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          use_sudo: "${DOCKER_USE_SUDO}"
          image: "${DOCKER_IMAGE}"
          log_lines: "${LOG_LINES}"

      - label: Container Status
        icon: system
        content: List all containers with complete status details and show recent Docker events.
        action_id: troubleshoot_docker
        parameters:
          mode: containers
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          use_sudo: "${DOCKER_USE_SUDO}"
          log_lines: "${LOG_LINES}"



  - label: SecOnion
    icon: flag
    content: Run common SecOnion status, resource, service, and log checks.
    children:
      - label: Run so-status
        icon: readiness
        content: Run so-status and list SecOnion containers.
        action_id: troubleshoot_security_onion
        parameters:
          mode: status
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          log_lines: "${LOG_LINES}"

      - label: System Health
        icon: system
        content: Check load, memory, filesystem usage, Docker service health, and failed systemd services.
        action_id: troubleshoot_security_onion
        parameters:
          mode: health
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          log_lines: "${LOG_LINES}"

      - label: Read Core Logs
        icon: document
        content: Read recent Docker and Salt journals plus SecOnion Suricata and Kibana logs.
        action_id: troubleshoot_security_onion
        parameters:
          mode: logs
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          log_lines: "${LOG_LINES}"

      - label: Selected Service Logs
        icon: document
        content: Inspect SECURITY_ONION_SERVICE and read its latest Docker logs.
        action_id: troubleshoot_security_onion
        parameters:
          mode: service_logs
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          service: "${SECURITY_ONION_SERVICE}"
          log_lines: "${LOG_LINES}"

      - label: Run SecOnion Check-in
        icon: run
        content: Run so-checkin to apply all Salt states. This can change services and configuration on the target.
        action_id: troubleshoot_security_onion
        confirm: true
        confirm_message: Run a full SecOnion Salt check-in on the selected target?
        parameters:
          mode: checkin
          target: "${TARGET_MODE}"
          host: "${REMOTE_HOST}"
          port: "${REMOTE_PORT}"
          accept_new_host_key: "${REMOTE_ACCEPT_NEW_HOST_KEY}"
          log_lines: "${LOG_LINES}"

