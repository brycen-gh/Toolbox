title: Deployment

menu:
  - label: Deployment
    icon: 🚀
    content: |
      Here we have a collection of useful scripts used to deploy a collection of useful tools. 
      Unfortunately, this script will require internet access the first time you run it.
      At least until the containers are downloaded, the toolbox will not work offline.

      If you wanna be lazy and run each of these scripts. Run this.
    action: |
      import time
      print("Deploying to STAGING...")
      print("Installing Docker...")
      time.sleep(4)
      print("Installing Portainer...")



  - label: Prep Install
    icon: 💻
    children:

      - label: Install Docker
        action: scripts/example.py
        content: Create required user and group for Docker, then install Docker and Docker Compose on your system. 


      - label: Install Portainer
        action: scripts/example.py
        content: (Optional) Install Portainer, a web-based management tool for Docker. This will allow you to manage your containers through a web interface on port 9000.


      - label: Update Containers
        action: print("Updating containers...")
                docker

        content: |
                Download or Update the local containers.
                This will pull the latest version of the containers from Docker Hub and update them on your local machine.
                These containers will be downloaded to the ./repos/containers folder and will be used to run the tools in the toolbox.





      - label: Install Containers
        content: |
                This will install the containers required to run the toolbox.
                These are the containers downloaded to the ./repos/containers folder.
                Click each of the buttons below to install the containers.

        children:
          - label: Install Docker
            action: scripts/example.py
            content: Create required user and group for Docker, then install Docker and Docker Compose on your system. 




  - label: Containers
    icon: 🐳

    children:
      - label: Install Docker Containers
        content: Deploys the current build to the staging environment.
        action: print("Deploying to STAGING...")







  - label: Settings
    icon: ⚙️
    children:
      - label: Variable Settings
        icon: 🔧
        content: Manage application variables stored in variables.yaml
        # special flag so the app knows to open the editor
        special: variables_editor

      - label: About
        content: Howdy! This is a toolbox made by Mr. G and Grok.