title: Deployment

menu:
  - label: Deployment
    icon: 🚀
    content: |
      Here we have a collection of useful scripts used to deploy a collection of useful tools. 
      Unfortunately, this script will require internet access the first time you run it.
      At least until the containers are downloaded, the toolbox will not work offline.

      Check status of the items of the below items.
    action: |
      import subprocess
      subprocess.run(["docker", "ps"], check=True)
      print("Docker containers are running.")
      



  - label: Prep Install
    icon: 💻
    children:

      - label: Install Docker
        content: Create required user and group for Docker, then install Docker and Docker Compose on your system. 
        action: |
          # Check if Docker is already installed
          import subprocess
          try:
              subprocess.run(["docker", "--version"], check=True)
              print("Docker is already installed.")
          except subprocess.CalledProcessError:
              print("Installing Docker...")
              subprocess.run(["sudo", "apt-get", "install", "-y", "docker.io"], check=True)
              print("Docker installation complete.")


      - label: Update Containers
        content: |
                Download or Update the local containers.
                This will pull the latest version of the containers from Docker Hub and update them on your local machine.
                These containers will be downloaded to the ./repos/containers folder and will be used to run the tools in the toolbox.
        action: print("Updating containers...")


      - label: Install Portainer
        content: (Completely Optional) Install Portainer, a web-based management tool for Docker. This will allow you to manage your containers through a web interface on port 9000.
        action: |
          # Check if Portainer is already installed
          import subprocess
          try:
              subprocess.run(["docker", "ps"], check=True)
              print("Portainer is already installed.")
          except subprocess.CalledProcessError:
              print("Installing Portainer...")
              subprocess.run(["sudo", "docker", "run", "-d", "-p", "9000:9000", "--name", "portainer", "--restart=always", "-v", "/var/run/docker.sock:/var/run/docker.sock", "-v", "portainer_data:/data", "portainer/portainer-ce"], check=True)
              print("Portainer installation complete.")




