  - label: SecOnion
    icon: flag
    content: Check or clear the SecOnion instance used by this training environment.
    children:
      - label: Check SecOnion Status
        icon: readiness
        content: Run so-status and list SecOnion containers on the configured target.
        action_id: troubleshoot_security_onion
        parameters:
          mode: status
          target: "${SECURITY_ONION_TARGET_MODE}"
          host: "${SECURITY_ONION_REMOTE_HOST}"
          port: "${SECURITY_ONION_REMOTE_PORT}"
          accept_new_host_key: "${SECURITY_ONION_ACCEPT_NEW_HOST_KEY}"
          log_lines: 200

      - label: Config Remote Creds
        icon: save
        content: |
          Prompt for the SecOnion SSH username, SSH/sudo password, and a
          vault passphrase. Only encrypted values are written to
          variables/training-variables.yaml.
        action_id: configure_remote_credentials

      - label: Lock Session Creds
        icon: reset
        content: Remove local sudo and decrypted SecOnion creds from application memory.
        action_id: lock_remote_credentials

      - label: Clear SecOnion Data
        icon: delete
        content: |
          Permanently run so-elastic-clear on the configured SecOnion
          target. This deletes all Elasticsearch documents and indices, including
          alerts and searchable event data. It does not delete the toolbox PCAPs.
        action_id: troubleshoot_security_onion
        confirm: true
        confirm_message: Permanently delete all SecOnion Elasticsearch documents and indices on the selected target?
        confirm_phrase: CLEAR SECURITY ONION DATA
        parameters:
          mode: clear
          target: "${SECURITY_ONION_TARGET_MODE}"
          host: "${SECURITY_ONION_REMOTE_HOST}"
          port: "${SECURITY_ONION_REMOTE_PORT}"
          accept_new_host_key: "${SECURITY_ONION_ACCEPT_NEW_HOST_KEY}"
          log_lines: 200

  - label: Settings
    icon: settings
    children:
      - label: Variable Settings
        icon: variables
        content: Change PCAP replay and SecOnion target settings in variables/training-variables.yaml.
        special: variables_editor

      - label: About
        icon: information
        content: |
          Training PCAPs are replayed with tcpreplay through the interface
          configured as TARGET_DEVICE in variables/training-variables.yaml.
          SecOnion may be local or remote; saved remote creds are
          encrypted and the vault passphrase is never written to disk.
