title: Training

Home:
  label: Training
  icon: flag
  content: |
    # PCAP Training

    Replay saved training captures through the configured target interface.
    PCAP files are loaded from ./repos/pcap by default.

    The SecOnion section can check or clear a local or remote training SIEM.
    Remote creds are encrypted and unlocked once per app session.

    Only replay captures on an isolated training network where you have
    authorization to generate the recorded traffic.

VariablesFile: training-variables.yaml

