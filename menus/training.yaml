  - label: Host Actions
    icon: computer
    content: Generate controlled activity on this Windows VM, inspect its local event logs, and clean up exercise artifacts.
    children:
      - label: Check Local Readiness
        icon: readiness
        content: Check elevation, Windows event logs, and audit policy without changing the computer.
        action_id: local_host_training
        parameters:
          mode: readiness
          scenario: process_creation

      - label: Successful Login
        icon: document
        content: Generate one successful interactive authentication using a temporary local training account.
        children:
          - label: Run Exercise
            icon: run
            content: Generate the activity and save a unique instructor run record.
            action_id: local_host_training
            confirm: true
            confirm_message: Run the Successful Login exercise on this Windows computer?
            parameters:
              mode: run
              scenario: successful_login

          - label: Analyze Local Logs
            icon: search
            content: Inspect local Windows logs for the latest run and export candidate evidence.
            action_id: local_host_training
            parameters:
              mode: analyze
              scenario: successful_login
              run_id: latest

          - label: Show Instructor Record
            icon: information
            content: Display the execution record for the latest run; this is separate from analyst scoring.
            action_id: local_host_training
            parameters:
              mode: results
              scenario: successful_login
              run_id: latest

          - label: Clean Up Latest Run
            icon: delete
            content: Remove artifacts owned by the latest run while preserving its record and Windows event logs.
            action_id: local_host_training
            confirm: true
            confirm_message: Clean up artifacts from the latest Successful Login exercise?
            parameters:
