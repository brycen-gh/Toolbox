Variables:
  CONTAINER_DATA_ROOT: ~/.local/share/yaml-toolbox/containers
  CONTAINER_IMAGE_ARCHIVE_ROOT: ./repos/containers
  CONTAINER_IMAGE_PULL_ATTEMPTS: 3
  BACKUP_DIRECTORY: ./backups

  OPENPROJECT_CONTAINER_NAME: openproject
  OPENPROJECT_IMAGE: openproject/openproject:17
  OPENPROJECT_RECREATE: false
  OPENPROJECT_RESTART_POLICY: unless-stopped
  OPENPROJECT_HOST_PORT: 8080
  OPENPROJECT_CONTAINER_PORT: 80
  OPENPROJECT_DATA_VOLUME: "${CONTAINER_DATA_ROOT}/openproject"
  OPENPROJECT_DATA_PATH: /var/openproject/assets
  OPENPROJECT_SECRET_KEY_BASE: "${GENERATED_SECRET}"
  OPENPROJECT_HOST_NAME: "localhost:${OPENPROJECT_HOST_PORT}"
  OPENPROJECT_HTTPS: false

  ETHERPAD_CONTAINER_NAME: etherpad
  ETHERPAD_IMAGE: etherpad/etherpad:latest
  ETHERPAD_RECREATE: false
  ETHERPAD_RESTART_POLICY: unless-stopped
  ETHERPAD_HOST_PORT: 9001
  ETHERPAD_CONTAINER_PORT: 9001
  ETHERPAD_DATA_VOLUME: "${CONTAINER_DATA_ROOT}/etherpad"
  ETHERPAD_DATA_PATH: /opt/etherpad-lite/var

  NEXTCLOUD_CONTAINER_NAME: nextcloud
  NEXTCLOUD_IMAGE: nextcloud:latest
  NEXTCLOUD_RECREATE: false
  NEXTCLOUD_RESTART_POLICY: unless-stopped
  NEXTCLOUD_HOST_PORT: 8081
  NEXTCLOUD_CONTAINER_PORT: 80
  NEXTCLOUD_DATA_VOLUME: "${CONTAINER_DATA_ROOT}/nextcloud"
  NEXTCLOUD_DATA_PATH: /var/www/html

  CTFD_CONTAINER_NAME: ctfd
  CTFD_IMAGE: ctfd/ctfd:latest
  CTFD_RECREATE: false
  CTFD_RESTART_POLICY: unless-stopped
  CTFD_HOST_PORT: 8000
  CTFD_CONTAINER_PORT: 8000
  CTFD_DATA_VOLUME: "${CONTAINER_DATA_ROOT}/ctfd"
  CTFD_DATA_PATH: /var/uploads
  CTFD_SECRET_KEY: "${GENERATED_SECRET}"

  PORTAINER_CONTAINER_NAME: portainer
  PORTAINER_IMAGE: portainer/portainer-ce:lts
  PORTAINER_RECREATE: false
  PORTAINER_RESTART_POLICY: unless-stopped
  PORTAINER_EDGE_HOST_PORT: 8000
  PORTAINER_EDGE_CONTAINER_PORT: 8000
  PORTAINER_HTTPS_HOST_PORT: 9443
  PORTAINER_HTTPS_CONTAINER_PORT: 9443
  PORTAINER_DOCKER_SOCKET: /var/run/docker.sock
  PORTAINER_DOCKER_SOCKET_TARGET: /var/run/docker.sock
  PORTAINER_DATA_VOLUME: "${CONTAINER_DATA_ROOT}/portainer"
  PORTAINER_DATA_PATH: /data
