Variables:
  GUACAMOLE_CONTAINER_NAME: guacamole
  GUACAMOLE_DATABASE_CONTAINER_NAME: guacamole-database
  GUACAMOLE_GUACD_CONTAINER_NAME: guacd
  GUACAMOLE_IMAGE: guacamole/guacamole:1.6.0
  GUACAMOLE_DATABASE_IMAGE: postgres:17-alpine
  GUACAMOLE_GUACD_IMAGE: guacamole/guacd:1.6.0
  GUACAMOLE_RECREATE: false
  GUACAMOLE_RESTART_POLICY: unless-stopped
  GUACAMOLE_HOST_PORT: 8085
  GUACAMOLE_DATA_VOLUME: ${CONTAINER_DATA_ROOT}/guacamole-stack
