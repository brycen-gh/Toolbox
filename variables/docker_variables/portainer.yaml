Variables:
  PORTAINER_SETUP_TOKEN: ggtoolbox
  PORTAINER_CONTAINER_NAME: portainer
  PORTAINER_IMAGE: portainer/portainer-ce:lts
  PORTAINER_RECREATE: true
  PORTAINER_RESTART_POLICY: unless-stopped
  PORTAINER_EDGE_HOST_PORT: 8000
  PORTAINER_EDGE_CONTAINER_PORT: 8000
  PORTAINER_HTTPS_HOST_PORT: 9443
  PORTAINER_HTTPS_CONTAINER_PORT: 9443
  PORTAINER_DOCKER_SOCKET: /var/run/docker.sock
  PORTAINER_DOCKER_SOCKET_TARGET: /var/run/docker.sock
  PORTAINER_DATA_VOLUME: ${CONTAINER_DATA_ROOT}/portainer
  PORTAINER_DATA_PATH: /data
