# Editable settings; ${NAME} references are expanded when an action runs.
Variables:
  NEXTCLOUD_CONTAINER_NAME: nextcloud
  NEXTCLOUD_IMAGE: nextcloud:latest
  NEXTCLOUD_RECREATE: false
  NEXTCLOUD_RESTART_POLICY: unless-stopped
  NEXTCLOUD_HOST_PORT: 8081
  NEXTCLOUD_CONTAINER_PORT: 80
  NEXTCLOUD_DATA_VOLUME: "${CONTAINER_DATA_ROOT}/nextcloud"
  NEXTCLOUD_DATA_PATH: /var/www/html
