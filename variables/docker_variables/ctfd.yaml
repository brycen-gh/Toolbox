Variables:
  CTFD_CONTAINER_NAME: ctfd
  CTFD_IMAGE: ctfd/ctfd:latest
  CTFD_RECREATE: false
  CTFD_RESTART_POLICY: unless-stopped
  CTFD_HOST_PORT: 4562
  CTFD_CONTAINER_PORT: 8000
  CTFD_DATA_VOLUME: ${CONTAINER_DATA_ROOT}/ctfd
  CTFD_DATA_PATH: /var/uploads
  CTFD_SECRET_KEY: ${GENERATED_SECRET}
